<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Marcenaria Elite | Administrativo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="mark">E</span><div><b>Elite Planejados</b><small>Administrativo</small></div></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <header><div><h1 id="pageTitle">Dashboard</h1><p>Marcenaria Elite Planejados</p></div><button id="newBtn">+ Novo lançamento</button></header>
    <section id="app"></section>
  </main>
  <dialog id="modal">
    <form method="dialog" id="entryForm">
      <div class="modal-head"><h2 id="modalTitle">Novo lançamento</h2><button value="cancel" class="x">×</button></div>
      <div id="fields" class="form-grid"></div>
      <div class="actions"><button value="cancel" class="secondary">Cancelar</button><button id="saveBtn" value="default">Salvar</button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
