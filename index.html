<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Marcenaria Elite | Administrativo</title><link rel="stylesheet" href="style.css"></head><body>
<section id="authScreen" class="auth-screen"><div class="auth-card"><div class="brand auth-brand"><span class="mark">E</span><div><b>Elite Planejados</b><small>Sistema Administrativo</small></div></div><h1>Entrar</h1><p class="muted">Acesse os dados da marcenaria de qualquer dispositivo.</p><form id="authForm"><label>E-mail<input id="authEmail" type="email" required></label><label>Senha<input id="authPassword" type="password" minlength="6" required></label><button type="submit">Entrar</button><button type="button" id="signupBtn" class="secondary">Criar minha conta</button><p id="authMessage"></p></form></div></section>
